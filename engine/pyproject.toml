[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statly_engine"
version = "0.1.0"
description = "Statly stats-engine sidecar (JSON-RPC over stdio)"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller",
]

[tool.setuptools.packages.find]
include = ["statly_engine*"]
