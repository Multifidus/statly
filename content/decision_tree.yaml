# Test Advisor decision tree (SPEC §7.1).
#
# Single source of truth for test selection: nothing about which test to
# recommend is hard-coded in Python. The engine (engine/statly_engine/advisor)
# loads this file, validates it against decision_tree.schema.json, and walks
# it with a pure function: (tree, answers) -> next question | recommendation.
#
# Node types:
#   question       - id, text (plain language), why (plain-language reason we
#                     ask), optional auto (answered from dataset_context: the
#                     user can still override), options[] (value, label, next).
#   recommendation - primary_test, nonparametric_alternative, assumptions[],
#                     effect_size[], post_hoc[], why_this_test, likert_note,
#                     caveats[]. Analysis/assumption/effect-size ids are
#                     snake_case and owned by the engine's stats registry.
#
# `auto.field` is one of the five dataset_context signals the frontend can
# derive from variable roles/levels (SPEC §7.1): outcome_level, num_groups,
# num_time_points, linked_mode, covariates_present. `auto.rules` are matched
# in order; the first rule whose `when` matches the field's value supplies the
# answer. `when` supports equals / min / max / in - plain value comparisons,
# not statistical logic, so the tree stays the single source of truth.

version: 1
root: q_intent

nodes:

  # ---------------------------------------------------------------------
  # Root: what do you want to know? (SPEC §7.1)
  # ---------------------------------------------------------------------
  q_intent:
    type: question
    text: "What do you want to know?"
    why: >
      Statly picks a test by first understanding the shape of your question,
      then the shape of your data. Starting here keeps the questions that
      follow short and relevant.
    hint: >
      Different questions call for different statistical tests, so start
      with what you're trying to find out.
    options:
      - value: compare
        label: "Did scores change over time, or differ between groups?"
        description: "For example, comparing test scores before and after a workshop, or across three class sections."
        next: q_compare_outcome_level
      - value: relate
        label: "Are two things related?"
        description: "For example, whether hours studied is related to exam score."
        next: q_relate_variable_types
      - value: predict
        label: "Can one thing predict another?"
        description: "For example, using pretest score and attendance to predict final exam score."
        next: q_predict_outcome_type
      - value: reliability
        label: "Do my survey questions hang together?"
        description: "For example, checking whether ten survey items all measure the same thing, like classroom engagement."
        next: q_reliability_type
      - value: validity
        label: "Do my questions measure what I think they measure?"
        description: "For example, checking whether a 20-item survey really captures the four topics it's supposed to."
        next: q_validity_stage

  # =======================================================================
  # COMPARE branch
  # =======================================================================
  q_compare_outcome_level:
    type: question
    text: "What is your outcome (the thing you're comparing)?"
    why: >
      How a variable is measured decides the whole family of tests available
      for it. A single survey question answered on a 1-5 scale behaves very
      differently from a total test score, and both behave differently from
      a category like pass/fail.
    hint: >
      The outcome is the variable you're comparing across groups or time
      points; how it's measured (a category, a rating, or a score) decides
      which test fits.
    auto:
      field: outcome_level
      rules:
        - when: { equals: "nominal" }
          value: nominal
        - when: { equals: "ordinal" }
          value: ordinal
        - when: { equals: "continuous" }
          value: continuous
    options:
      - value: nominal
        label: "A category, like pass/fail or yes/no"
        description: "For example, whether each student passed or failed the course."
        next: q_compare_categorical
      - value: ordinal
        label: "A single survey item on a rating scale (e.g. one Likert question)"
        description: "For example, one question like \"I enjoyed this class\" rated 1 to 5."
        next: q_compare_design_ordinal
      - value: continuous
        label: "A score or scale total (e.g. a test score or a multi-item scale average)"
        description: "For example, a 0-100 exam score, or the average of ten satisfaction items."
        next: q_compare_design

  # --- categorical (nominal) outcome ------------------------------------
  q_compare_categorical:
    type: question
    text: "How is your category comparison set up?"
    why: >
      With categories, the right test depends on whether you're checking
      against an expected pattern, comparing independent groups, or
      comparing the same respondents' answers across time.
    hint: >
      This decides whether you're checking one variable against an
      expected pattern, comparing two separate groups, or tracking the
      same people's category over time.
    options:
      - value: one_var_vs_expected
        label: "One category variable vs. an expected pattern (e.g. is enrollment evenly split by major?)"
        description: "For example, checking whether students are evenly split across three majors."
        next: rec_chi_square_gof
      - value: two_groups_independent
        label: "Two category variables, independent groups (e.g. pass/fail by class section)"
        description: "For example, comparing pass/fail rates between two different class sections."
        next: rec_chi_square_independence
      - value: linked_two_time_points
        label: "Same respondents, yes/no answer, two time points (linked)"
        description: "For example, the same students answering yes/no both before and after an intervention."
        next: rec_mcnemar
      - value: linked_three_plus_time_points
        label: "Same respondents, yes/no answer, three or more time points (linked)"
        description: "For example, the same students answering yes/no at the start, middle, and end of the semester."
        next: rec_cochran_q

  rec_chi_square_gof:
    type: recommendation
    primary_test: chi_square.goodness_of_fit
    nonparametric_alternative: null
    assumptions: [expected_cell_counts, independence_of_observations]
    effect_size: [cramers_v]
    post_hoc: []
    why_this_test: >
      A chi-square goodness-of-fit test compares the counts you observed in
      each category to the counts you'd expect under some pattern (an even
      split, or a known population breakdown). It tells you whether the
      difference is bigger than chance would produce.
    likert_note: null
    caveats: []

  rec_chi_square_independence:
    type: recommendation
    primary_test: chi_square.independence
    nonparametric_alternative: fisher_exact
    assumptions: [expected_cell_counts, independence_of_observations]
    effect_size: [cramers_v, phi]
    post_hoc: []
    why_this_test: >
      A chi-square test of independence checks whether two categorical
      variables are related - for example, whether pass/fail rates differ
      by class section. When any expected cell count is small (a common
      problem with small samples), Fisher's exact test is the safer choice
      because it doesn't rely on a large-sample approximation.
    likert_note: null
    caveats: []

  rec_mcnemar:
    type: recommendation
    primary_test: mcnemar
    nonparametric_alternative: null
    assumptions: [independence_of_pairs]
    effect_size: [odds_ratio]
    post_hoc: []
    why_this_test: >
      McNemar's test is built for a yes/no answer measured twice on the same
      people. Instead of comparing two separate groups, it focuses on the
      respondents who switched their answer between the two time points,
      which is exactly what "change" means for a linked yes/no variable.
    likert_note: null
    caveats: []

  rec_cochran_q:
    type: recommendation
    primary_test: cochran_q
    nonparametric_alternative: null
    assumptions: [independence_of_pairs]
    effect_size: [kendalls_w]
    post_hoc: []
    why_this_test: >
      Cochran's Q extends McNemar's test to three or more linked time points
      or conditions with a yes/no answer. It tells you whether the
      proportion answering "yes" changed anywhere across those time points.
    likert_note: null
    caveats: []

  # --- ordinal (single Likert item) outcome -----------------------------
  q_compare_design_ordinal:
    type: question
    text: "What are you comparing?"
    why: >
      A single rating-scale question is ordinal data: the gap between
      "agree" and "strongly agree" isn't guaranteed to equal the gap between
      "disagree" and "agree". Statly recommends rank-based (nonparametric)
      tests for this kind of variable, which compare ranks instead of means.
    hint: >
      Ratings like "agree" vs "strongly agree" aren't guaranteed to be
      evenly spaced, so single rating-scale questions use rank-based tests
      instead of tests built for scores.
    options:
      - value: vs_fixed_value
        label: "Comparing to a known or expected value"
        description: "For example, checking whether the average rating differs from the scale's midpoint of 3."
        next: rec_wilcoxon_one_sample
      - value: independent_groups
        label: "Independent groups (different people in each group)"
        description: "For example, comparing one class's rating of a lesson to a different class's rating."
        next: q_compare_ordinal_groups
      - value: repeated_linked
        label: "Same respondents, measured more than once (linked)"
        description: "For example, the same students rating their confidence before and after a unit, matched by ID."
        next: q_compare_ordinal_time
      - value: repeated_aggregate
        label: "Comparing time points, but respondents are NOT linked across them"
        description: "For example, comparing this term's rating average to last term's, with no way to match students."
        next: q_compare_ordinal_aggregate

  rec_wilcoxon_one_sample:
    type: recommendation
    primary_test: wilcoxon_one_sample
    nonparametric_alternative: null
    assumptions: [symmetry_of_differences]
    effect_size: [rank_biserial]
    post_hoc: []
    why_this_test: >
      The one-sample Wilcoxon test compares the ranks of your ratings to a
      fixed value without assuming the scale behaves like a continuous,
      evenly-spaced measurement - appropriate for a single rating-scale item.
    likert_note: >
      This is a single Likert item, so it's ordinal data. Statly recommends
      a rank-based test rather than a one-sample t-test.
    caveats: []

  q_compare_ordinal_groups:
    type: question
    text: "How many groups are you comparing?"
    why: "The number of groups decides whether you need a two-group or a multi-group rank test."
    hint: "A group here means a set of different people being compared to each other, like two separate classes."
    auto:
      field: num_groups
      rules:
        - when: { equals: 2 }
          value: two
        - when: { min: 3 }
          value: three_plus
    options:
      - value: two
        label: "Two groups"
        description: "For example, comparing one rating between Class A and Class B."
        next: rec_mann_whitney
      - value: three_plus
        label: "Three or more groups"
        description: "For example, comparing one rating across three or more class sections."
        next: rec_kruskal_wallis

  rec_mann_whitney:
    type: recommendation
    primary_test: mann_whitney
    nonparametric_alternative: null
    assumptions: [independence_of_observations, similar_shape_of_distributions]
    effect_size: [rank_biserial]
    post_hoc: []
    why_this_test: >
      The Mann-Whitney U test compares the ranks of two independent groups'
      ratings rather than their means, which fits a single rating-scale item
      better than an independent-samples t-test.
    likert_note: >
      This is a single Likert item, so it's ordinal data. Statly recommends
      the Mann-Whitney U test rather than an independent-samples t-test; if
      you had a multi-item scale score instead, a t-test would be reasonable.
    caveats: []

  rec_kruskal_wallis:
    type: recommendation
    primary_test: kruskal_wallis
    nonparametric_alternative: null
    assumptions: [independence_of_observations, similar_shape_of_distributions]
    effect_size: [epsilon_squared]
    post_hoc: [posthoc.dunn]
    why_this_test: >
      The Kruskal-Wallis test extends the Mann-Whitney idea to three or more
      independent groups, comparing ranks instead of means - a better fit
      for a single rating-scale item than a one-way ANOVA.
    likert_note: >
      This is a single Likert item, so it's ordinal data. Statly recommends
      Kruskal-Wallis rather than a one-way ANOVA.
    caveats: []

  q_compare_ordinal_time:
    type: question
    text: "How many time points or conditions?"
    why: "Two linked time points and three-or-more linked time points need different rank tests."
    hint: "A time point is one occasion the same people were measured, like before and after a lesson."
    auto:
      field: num_time_points
      rules:
        - when: { equals: 2 }
          value: two
        - when: { min: 3 }
          value: three_plus
    options:
      - value: two
        label: "Two"
        description: "For example, the same students rated confidence once before and once after a unit."
        next: q_compare_ordinal_paired_method
      - value: three_plus
        label: "Three or more"
        description: "For example, the same students rated confidence at the start, middle, and end of a course."
        next: rec_friedman

  q_compare_ordinal_paired_method:
    type: question
    text: "Do you want the more common signed-rank test, or the simpler sign test?"
    why: >
      The Wilcoxon signed-rank test uses both the direction and size of each
      person's change and is the usual first choice. The sign test only uses
      the direction of change (up or down); it's simpler and more robust,
      but less powerful, and is sometimes preferred when the size of the
      change isn't meaningful.
    hint: >
      Both tests compare each person's rating at two time points; they
      differ in how much detail about the change they use.
    options:
      - value: signed_rank
        label: "Signed-rank test (usual choice)"
        description: "Uses how much each person's rating changed, not just whether it went up or down."
        next: rec_wilcoxon_signed_rank
      - value: sign
        label: "Sign test (simpler, direction only)"
        description: "Only counts whether each person's rating went up or down, ignoring the size of the change."
        next: rec_sign_test

  rec_wilcoxon_signed_rank:
    type: recommendation
    primary_test: wilcoxon_signed_rank
    nonparametric_alternative: null
    assumptions: [symmetry_of_differences]
    effect_size: [rank_biserial]
    post_hoc: []
    why_this_test: >
      The Wilcoxon signed-rank test compares each person's two ratings by
      ranking the sizes of their changes, which fits a single rating-scale
      item measured twice on the same people better than a paired t-test.
    likert_note: >
      This is a single Likert item, so it's ordinal data. Statly recommends
      the Wilcoxon signed-rank test rather than a paired t-test.
    caveats: []

  rec_sign_test:
    type: recommendation
    primary_test: sign_test
    nonparametric_alternative: null
    assumptions: []
    effect_size: [rank_biserial]
    post_hoc: []
    why_this_test: >
      The sign test only looks at whether each person's rating went up or
      down, ignoring how much it changed. It makes the fewest assumptions of
      any paired comparison, at the cost of some statistical power.
    likert_note: >
      This is a single Likert item, so it's ordinal data. The sign test
      avoids assuming the scale is evenly spaced.
    caveats: []

  rec_friedman:
    type: recommendation
    primary_test: friedman
    nonparametric_alternative: null
    assumptions: [independence_of_observations]
    effect_size: [kendalls_w]
    post_hoc: [posthoc.conover]
    why_this_test: >
      The Friedman test compares ranks across three or more linked time
      points or conditions for the same people - a rank-based counterpart
      to repeated-measures ANOVA.
    likert_note: >
      This is a single Likert item, so it's ordinal data. Statly recommends
      Friedman rather than repeated-measures ANOVA.
    caveats: []

  q_compare_ordinal_aggregate:
    type: question
    text: "How many time points are you comparing?"
    why: >
      Without a way to link respondents across time, each time point has to
      be treated as an independent group, even if some of the same people
      answered more than once.
    hint: >
      Aggregate means you can't match individual respondents across time
      points, so each time point is treated as its own group.
    auto:
      field: num_time_points
      rules:
        - when: { equals: 2 }
          value: two
        - when: { min: 3 }
          value: three_plus
    options:
      - value: two
        label: "Two"
        description: "For example, comparing this term's average rating to last term's, without linking students."
        next: rec_mann_whitney_aggregate
      - value: three_plus
        label: "Three or more"
        description: "For example, comparing average ratings across three unlinked terms or cohorts."
        next: rec_kruskal_wallis_aggregate

  rec_mann_whitney_aggregate:
    type: recommendation
    primary_test: mann_whitney
    nonparametric_alternative: null
    assumptions: [independence_of_observations, similar_shape_of_distributions]
    effect_size: [rank_biserial]
    post_hoc: []
    why_this_test: >
      Without linked IDs, Statly can't pair up each respondent's before and
      after rating, so the two time points are compared as independent
      groups using the Mann-Whitney U test.
    likert_note: >
      This is a single Likert item, so it's ordinal data. Statly recommends
      the Mann-Whitney U test rather than an independent-samples t-test.
    caveats: [aggregate_time_comparison]

  rec_kruskal_wallis_aggregate:
    type: recommendation
    primary_test: kruskal_wallis
    nonparametric_alternative: null
    assumptions: [independence_of_observations, similar_shape_of_distributions]
    effect_size: [epsilon_squared]
    post_hoc: [posthoc.dunn]
    why_this_test: >
      Without linked IDs, the time points are compared as independent
      groups using Kruskal-Wallis rather than a repeated-measures rank test.
    likert_note: >
      This is a single Likert item, so it's ordinal data. Statly recommends
      Kruskal-Wallis rather than a one-way ANOVA.
    caveats: [aggregate_time_comparison]

  # --- continuous (score / scale) outcome --------------------------------
  q_compare_design:
    type: question
    text: "What are you comparing?"
    why: >
      This decides the overall family of test: comparing to a fixed value,
      comparing independent groups, comparing the same people over time, or
      comparing time points you can't link.
    hint: >
      This sets the overall type of test: comparing to a fixed number,
      comparing separate groups, or tracking the same people over time.
    options:
      - value: vs_fixed_value
        label: "Comparing to a known or expected value (e.g. a benchmark score)"
        description: "For example, checking whether a class's average score differs from a passing threshold of 70."
        next: rec_t_one_sample
      - value: independent_groups
        label: "Independent groups (different people in each group/condition)"
        description: "For example, comparing average test scores between students taught by two different methods."
        next: q_compare_between_factors
      - value: repeated_linked
        label: "Same respondents, measured more than once (linked)"
        description: "For example, the same students' scores before and after tutoring, matched by student ID."
        next: q_compare_time_points
      - value: repeated_aggregate
        label: "Comparing time points, but respondents are NOT linked across them"
        description: "For example, comparing this year's average score to last year's, with no way to match students."
        next: q_compare_aggregate_groups

  rec_t_one_sample:
    type: recommendation
    primary_test: t_test.one_sample
    nonparametric_alternative: wilcoxon_one_sample
    assumptions: [normality]
    effect_size: [cohens_d]
    post_hoc: []
    why_this_test: >
      A one-sample t-test checks whether your group's average score differs
      from a known or expected value, such as a benchmark or population mean.
    likert_note: null
    caveats: []

  q_compare_between_factors:
    type: question
    text: "How many grouping variables (factors) do you have?"
    why: >
      Comparing groups on one variable (e.g. just "condition") is a
      different test than crossing two grouping variables at once (e.g.
      "condition" and "gender" together), which lets you ask whether they
      interact.
    hint: >
      A grouping variable splits people into groups you want to compare,
      like class section (A vs B) or teaching method (lecture vs
      workshop).
    options:
      - value: one
        label: "One grouping variable"
        description: "For example, comparing test scores across three class sections."
        next: q_compare_between_groups_count
      - value: two_plus
        label: "Two grouping variables (a factorial design)"
        description: "For example, teaching method (lecture vs workshop) and grade level (9th vs 10th) at the same time, so you can see whether the method works differently by grade."
        next: q_compare_multiple_outcomes

  q_compare_between_groups_count:
    type: question
    text: "How many groups?"
    why: "Two groups and three-or-more groups use different tests."
    hint: "A group is one of the categories of your grouping variable, like each class section."
    auto:
      field: num_groups
      rules:
        - when: { equals: 2 }
          value: two
        - when: { min: 3 }
          value: three_plus
    options:
      - value: two
        label: "Two groups"
        description: "For example, comparing test scores between two teaching methods."
        next: q_compare_covariate_two
      - value: three_plus
        label: "Three or more groups"
        description: "For example, comparing test scores across three or more class sections."
        next: q_compare_covariate_three

  q_compare_covariate_two:
    type: question
    text: "Do you want to control for another variable (a covariate), such as a pretest score?"
    why: >
      Controlling for a covariate - most often a pretest - removes
      differences that already existed before your groups were compared,
      so the comparison reflects the effect of the grouping variable itself.
    hint: >
      A covariate is a variable you control for statistically because it
      could otherwise explain away differences between groups.
    auto:
      field: covariates_present
      rules:
        - when: { equals: true }
          value: "yes"
        - when: { equals: false }
          value: "no"
    options:
      - value: "no"
        label: "No"
        description: "Compare the two groups' averages directly, with nothing else controlled for."
        next: rec_t_independent
      - value: "yes"
        label: "Yes"
        description: "For example, comparing post-test scores between two teaching methods while controlling for pretest score."
        next: rec_ancova

  rec_t_independent:
    type: recommendation
    primary_test: t_test.independent
    nonparametric_alternative: mann_whitney
    assumptions: [normality, homogeneity_of_variance]
    effect_size: [cohens_d, hedges_g]
    post_hoc: []
    why_this_test: >
      An independent-samples t-test compares the means of two independent
      groups. Statly runs Welch's version by default, which doesn't assume
      the two groups have equal variance - a safe default because it
      performs about as well as the classic (Student's) version when
      variances are equal, and much better when they aren't.
    likert_note: null
    caveats: []

  q_compare_covariate_three:
    type: question
    text: "Do you want to control for another variable (a covariate), such as a pretest score?"
    why: >
      Controlling for a covariate removes differences that already existed
      before your groups were compared, isolating the effect of the
      grouping variable.
    hint: >
      A covariate is a variable you control for statistically, most often
      a pretest score, so group differences aren't due to where students
      started.
    auto:
      field: covariates_present
      rules:
        - when: { equals: true }
          value: "yes"
        - when: { equals: false }
          value: "no"
    options:
      - value: "no"
        label: "No"
        description: "Compare the groups' averages directly, with nothing else controlled for."
        next: q_compare_variance_three
      - value: "yes"
        label: "Yes"
        description: "For example, comparing post-test scores across three teaching methods while controlling for pretest score."
        next: rec_ancova

  rec_ancova:
    type: recommendation
    primary_test: ancova
    nonparametric_alternative: ancova.quade
    assumptions: [normality, homogeneity_of_variance, linearity, homogeneity_of_regression_slopes]
    effect_size: [partial_eta_squared]
    post_hoc: [posthoc.pairwise]
    why_this_test: >
      ANCOVA compares group means after statistically adjusting for a
      covariate (commonly a pretest score), using estimated marginal means.
      This is the standard choice for "post-test adjusted for pretest"
      designs.
    likert_note: null
    caveats: []

  q_compare_variance_three:
    type: question
    text: "Do your groups have roughly similar amounts of spread (variance) in this outcome?"
    why: >
      A standard one-way ANOVA assumes each group's scores are spread out by
      about the same amount. When that's not true, Welch's ANOVA is a safer
      default because it doesn't rely on that assumption, similar to how
      Welch's t-test protects an independent-samples comparison.
    hint: >
      Spread (variance) is how much scores within each group vary; very
      different spreads across groups call for a more robust test.
    options:
      - value: similar
        label: "Yes, similar spread (or not sure)"
        description: "For example, all three class sections' scores cluster about as tightly around their averages."
        next: rec_anova_one_way
      - value: different
        label: "No, quite different spread across groups"
        description: "For example, one class section's scores are tightly clustered while another's are spread widely."
        next: rec_anova_welch

  rec_anova_one_way:
    type: recommendation
    primary_test: anova.one_way
    nonparametric_alternative: kruskal_wallis
    assumptions: [normality, homogeneity_of_variance]
    effect_size: [eta_squared, omega_squared, cohens_f]
    post_hoc: [posthoc.tukey, posthoc.pairwise]
    why_this_test: >
      A one-way ANOVA tests whether the means of three or more independent
      groups differ. It's the standard first choice when group spreads are
      roughly similar.
    likert_note: null
    caveats: []

  rec_anova_welch:
    type: recommendation
    primary_test: anova.welch
    nonparametric_alternative: kruskal_wallis
    assumptions: [normality]
    effect_size: [eta_squared, omega_squared, cohens_f]
    post_hoc: [posthoc.games_howell]
    why_this_test: >
      Welch's ANOVA compares three or more group means without assuming
      equal variances, the same protection Welch's t-test gives a two-group
      comparison. It's the safer default when groups' spreads differ.
    likert_note: null
    caveats: []

  q_compare_multiple_outcomes:
    type: question
    text: "Do you have more than one outcome variable you want to compare at once?"
    why: >
      When several related outcomes are analyzed together instead of one at
      a time, a multivariate test (MANOVA) controls the overall false-positive
      rate better than running separate ANOVAs.
    hint: >
      An outcome variable is what you're measuring as a result, like a
      test score; sometimes you have several related ones you want to
      analyze together.
    options:
      - value: one_outcome
        label: "No, one outcome"
        description: "For example, just comparing final exam score across groups."
        next: rec_anova_factorial
      - value: multiple_outcomes
        label: "Yes, several related outcomes together"
        description: "For example, comparing exam score, engagement rating, and attendance together across teaching methods."
        next: rec_manova

  rec_anova_factorial:
    type: recommendation
    primary_test: anova.factorial
    nonparametric_alternative: anova.art
    assumptions: [normality, homogeneity_of_variance]
    effect_size: [partial_eta_squared, omega_squared]
    post_hoc: [posthoc.tukey, posthoc.pairwise]
    why_this_test: >
      A factorial (two-way) ANOVA tests the effect of each grouping variable
      on its own, plus whether the two grouping variables interact - for
      example, whether an intervention works differently for different
      genders. Interactions get simple-effects follow-up tests.
    likert_note: null
    caveats: []

  rec_manova:
    type: recommendation
    primary_test: manova
    nonparametric_alternative: null
    assumptions: [multivariate_normality, homogeneity_of_covariance_matrices, linearity, multicollinearity]
    effect_size: [partial_eta_squared]
    post_hoc: []
    why_this_test: >
      MANOVA tests several related outcome variables together instead of
      running a separate ANOVA for each, which controls the overall
      false-positive rate. Statly reports Pillai's trace by default, along
      with follow-up univariate tests for each outcome.
    likert_note: null
    caveats: []

  q_compare_time_points:
    type: question
    text: "How many time points or conditions?"
    why: "Two linked time points is a paired comparison; three or more is a repeated-measures design."
    hint: "A time point is one occasion the same people were measured, like before and after an intervention."
    auto:
      field: num_time_points
      rules:
        - when: { equals: 2 }
          value: two
        - when: { min: 3 }
          value: three_plus
    options:
      - value: two
        label: "Two"
        description: "For example, the same students' scores measured once before and once after a workshop."
        next: rec_t_paired
      - value: three_plus
        label: "Three or more"
        description: "For example, the same students' scores measured at the start, middle, and end of a semester."
        next: q_compare_between_factor_rm

  rec_t_paired:
    type: recommendation
    primary_test: t_test.paired
    nonparametric_alternative: wilcoxon_signed_rank
    assumptions: [normality_of_differences]
    effect_size: [cohens_d_z, cohens_d_av]
    post_hoc: []
    why_this_test: >
      A paired t-test compares each linked respondent's two scores (e.g.
      pre and post) by looking at the average difference, which is more
      powerful than treating pre and post as independent groups when you
      can actually link respondents.
    likert_note: null
    caveats: []

  q_compare_between_factor_rm:
    type: question
    text: "Do you also have a between-subjects grouping variable (e.g. control vs. intervention)?"
    why: >
      Repeated measures on their own (everyone follows the same time
      course) is a different design from a mixed design, where you also
      want to know whether different groups change differently over time.
    hint: >
      A between-subjects grouping variable divides people into separate
      groups (like control vs. intervention), on top of the repeated time
      points everyone shares.
    options:
      - value: "no"
        label: "No, just repeated measures"
        description: "For example, tracking one group's scores across three time points, with no comparison groups."
        next: rec_anova_rm
      - value: "yes"
        label: "Yes, groups measured across the same time points"
        description: "For example, comparing a control group's scores over time to an intervention group's scores over the same time points."
        next: rec_anova_mixed

  rec_anova_rm:
    type: recommendation
    primary_test: anova.repeated_measures
    nonparametric_alternative: friedman
    assumptions: [normality, sphericity]
    effect_size: [partial_eta_squared, omega_squared]
    post_hoc: [posthoc.pairwise]
    why_this_test: >
      Repeated-measures ANOVA compares the same people's scores across
      three or more linked time points or conditions, using the correlation
      between repeated measurements to increase power. Mauchly's test
      checks sphericity, with Greenhouse-Geisser and Huynh-Feldt corrections
      available when it's violated.
    likert_note: null
    caveats: []

  rec_anova_mixed:
    type: recommendation
    primary_test: anova.mixed
    nonparametric_alternative: anova.art
    assumptions: [normality, sphericity, homogeneity_of_variance]
    effect_size: [partial_eta_squared, omega_squared]
    post_hoc: [posthoc.pairwise]
    why_this_test: >
      A mixed ANOVA combines a between-subjects grouping variable (e.g.
      control vs. intervention) with a within-subjects factor (e.g. time),
      so you can see the group x time interaction - whether groups change
      differently across time points. Significant interactions get
      simple-effects follow-up tests.
    likert_note: null
    caveats: []

  q_compare_aggregate_groups:
    type: question
    text: "How many time points are you comparing?"
    why: >
      Without a way to link respondents across time (no shared ID, or the
      user chose aggregate mode), each time point has to be compared as an
      independent group even if some of the same people answered more than
      once.
    hint: >
      Aggregate means you can't match individual respondents across time
      points, so each time point is compared as its own group.
    auto:
      field: num_time_points
      rules:
        - when: { equals: 2 }
          value: two
        - when: { min: 3 }
          value: three_plus
    options:
      - value: two
        label: "Two"
        description: "For example, comparing this year's average score to last year's, without linking students."
        next: rec_t_independent_aggregate
      - value: three_plus
        label: "Three or more"
        description: "For example, comparing average scores across three unlinked school years."
        next: rec_anova_one_way_aggregate

  rec_t_independent_aggregate:
    type: recommendation
    primary_test: t_test.independent
    nonparametric_alternative: mann_whitney
    assumptions: [normality, homogeneity_of_variance]
    effect_size: [cohens_d, hedges_g]
    post_hoc: []
    why_this_test: >
      Without linked IDs, Statly can't pair up each respondent's before and
      after score, so the two time points are compared as independent
      groups with Welch's independent-samples t-test.
    likert_note: null
    caveats: [aggregate_time_comparison]

  rec_anova_one_way_aggregate:
    type: recommendation
    primary_test: anova.one_way
    nonparametric_alternative: kruskal_wallis
    assumptions: [normality, homogeneity_of_variance]
    effect_size: [eta_squared, omega_squared, cohens_f]
    post_hoc: [posthoc.tukey, posthoc.pairwise]
    why_this_test: >
      Without linked IDs, the three or more time points are compared as
      independent groups using a one-way ANOVA rather than a
      repeated-measures ANOVA.
    likert_note: null
    caveats: [aggregate_time_comparison]

  # =======================================================================
  # RELATE branch (correlation)
  # =======================================================================
  q_relate_variable_types:
    type: question
    text: "What kind of variables are you relating?"
    why: >
      The right correlation coefficient depends on how both variables are
      measured, and whether you want to remove the influence of a third
      variable.
    hint: >
      Correlation measures how two variables move together; the right
      coefficient depends on how each variable is measured.
    options:
      - value: continuous_continuous
        label: "Both are scores or scale totals (continuous)"
        description: "For example, hours studied and exam score, both measured as numbers."
        next: rec_pearson
      - value: ordinal_involved
        label: "One or both are ranks or single rating-scale items (ordinal)"
        description: "For example, a single satisfaction rating (1-5) and exam score."
        next: q_relate_ordinal_detail
      - value: continuous_binary
        label: "One is a score, the other is a two-category variable (e.g. pass/fail)"
        description: "For example, exam score and whether the student passed or failed."
        next: rec_point_biserial
      - value: control_third_variable
        label: "I want to control for a third variable"
        description: "For example, relating study hours to exam score while accounting for prior GPA."
        next: rec_partial_correlation

  rec_pearson:
    type: recommendation
    primary_test: correlation.pearson
    nonparametric_alternative: correlation.spearman
    assumptions: [normality, linearity, homoscedasticity, outliers]
    effect_size: [pearson_r]
    post_hoc: []
    why_this_test: >
      Pearson's correlation measures the strength and direction of a
      straight-line relationship between two continuous variables.
    likert_note: null
    caveats: []

  q_relate_ordinal_detail:
    type: question
    text: "Do you have a small sample or a lot of tied ranks (e.g. many identical ratings)?"
    why: >
      Spearman's correlation is the usual rank-based choice. Kendall's
      tau-b handles tied ranks more precisely and tends to be more
      reliable in small samples, at the cost of being harder to interpret
      directly against Pearson's r.
    hint: >
      A tied rank happens when two or more responses share the exact same
      rating, which is common with small rating scales.
    auto:
      any:
        - field: n_complete
          rules:
            - when: { max: 29 }
              value: "yes"
        - field: outcome_distinct
          rules:
            - when: { max: 7 }
              value: "yes"
        - field: second_distinct
          rules:
            - when: { max: 7 }
              value: "yes"
      otherwise: "no"
    options:
      - value: "no"
        label: "No, use the usual choice"
        description: "Use Spearman's correlation, the standard rank-based choice."
        next: rec_spearman
      - value: "yes"
        label: "Yes"
        description: "For example, a survey with only 15 respondents, or a 5-point scale where many people picked the same rating."
        next: rec_kendall

  rec_spearman:
    type: recommendation
    primary_test: correlation.spearman
    nonparametric_alternative: correlation.kendall_tau_b
    assumptions: [monotonic_relationship]
    effect_size: [spearman_rho]
    post_hoc: []
    why_this_test: >
      Spearman's correlation measures the strength of a monotonic
      (consistently increasing or decreasing) relationship using ranks
      instead of raw values, which fits ordinal data such as a single
      rating-scale item.
    likert_note: >
      At least one variable here is a single Likert item, so it's ordinal
      data. Statly recommends a rank-based correlation rather than Pearson's r.
    caveats: []

  rec_kendall:
    type: recommendation
    primary_test: correlation.kendall_tau_b
    nonparametric_alternative: null
    assumptions: [monotonic_relationship]
    effect_size: [kendall_tau_b]
    post_hoc: []
    why_this_test: >
      Kendall's tau-b measures the relationship between two ranked
      variables based on how often pairs of observations agree in order.
      It handles tied ranks explicitly, which makes it a good choice for a
      small sample or many identical ratings.
    likert_note: >
      At least one variable here is a single Likert item, so it's ordinal
      data.
    caveats: []

  rec_point_biserial:
    type: recommendation
    primary_test: correlation.point_biserial
    nonparametric_alternative: null
    assumptions: [normality, homogeneity_of_variance]
    effect_size: [point_biserial_r]
    post_hoc: []
    why_this_test: >
      The point-biserial correlation measures the relationship between a
      continuous score and a genuinely two-category variable. It's
      mathematically equivalent to Pearson's r applied to a 0/1-coded group
      variable, and equivalent to an independent-samples t-test.
    likert_note: null
    caveats: []

  rec_partial_correlation:
    type: recommendation
    primary_test: correlation.partial
    nonparametric_alternative: null
    assumptions: [normality, linearity, homoscedasticity]
    effect_size: [pearson_r]
    post_hoc: []
    why_this_test: >
      A partial correlation measures the relationship between two variables
      after statistically removing the influence of one or more other
      variables, so the result isn't misleading you about what's actually
      driving the relationship.
    likert_note: null
    caveats: []

  # =======================================================================
  # PREDICT branch (regression)
  # =======================================================================
  q_predict_outcome_type:
    type: question
    text: "What kind of outcome do you want to predict?"
    why: >
      Regression comes in different flavors depending on how the outcome
      you're predicting is measured.
    hint: >
      Regression predicts one variable from others; which version you
      need depends on how the outcome you're predicting is measured.
    auto:
      field: outcome_level
      rules:
        - when: { equals: "continuous" }
          value: continuous
        - when: { equals: "ordinal" }
          value: ordinal
        - when: { equals: "nominal" }
          value: nominal
    options:
      - value: continuous
        label: "A score or scale total (continuous)"
        description: "For example, predicting a student's final exam score."
        next: q_predict_predictor_count
      - value: nominal
        label: "A category, like pass/fail"
        description: "For example, predicting whether a student passes or fails."
        next: q_predict_nominal_categories
      - value: ordinal
        label: "An ordered category (e.g. low/medium/high)"
        description: "For example, predicting whether a student's performance is low, medium, or high."
        next: rec_regression_ordinal

  q_predict_nominal_categories:
    type: question
    text: "How many categories does your outcome have?"
    why: "Binary logistic regression predicts a two-category outcome; more categories need a different model."
    hint: "A category outcome here is the group you're trying to predict membership in, like pass vs. fail."
    options:
      - value: two
        label: "Two categories (e.g. pass/fail)"
        description: "For example, predicting whether a student passes or fails."
        next: rec_regression_logistic
      - value: three_plus
        label: "Three or more categories"
        description: "For example, predicting which of four grade bands (A, B, C, D) a student will land in."
        next: rec_regression_logistic_multi

  rec_regression_logistic:
    type: recommendation
    primary_test: regression.logistic
    nonparametric_alternative: null
    assumptions: [linearity_of_logit, multicollinearity, independence_of_observations, outliers]
    effect_size: [odds_ratio, r_squared]
    post_hoc: []
    why_this_test: >
      Binary logistic regression predicts a two-category outcome (like
      pass/fail) from one or more predictors, reporting odds ratios for how
      each predictor shifts the odds of the outcome.
    likert_note: null
    caveats: []

  rec_regression_logistic_multi:
    type: recommendation
    primary_test: regression.logistic
    nonparametric_alternative: null
    assumptions: [linearity_of_logit, multicollinearity, independence_of_observations, outliers]
    effect_size: [odds_ratio, r_squared]
    post_hoc: []
    why_this_test: >
      Binary logistic regression predicts a two-category outcome. With
      three or more unordered categories, Statly currently models it as a
      series of binary comparisons rather than a full multinomial model;
      consider recoding to the comparison that matters most, or treating
      the outcome as ordinal if the categories have a natural order.
    likert_note: null
    caveats: [multinomial_outcome_not_supported]

  rec_regression_ordinal:
    type: recommendation
    primary_test: regression.ordinal
    nonparametric_alternative: null
    assumptions: [proportional_odds, multicollinearity, independence_of_observations]
    effect_size: [odds_ratio, r_squared]
    post_hoc: []
    why_this_test: >
      Ordinal logistic regression predicts an ordered-category outcome
      (like low/medium/high) while respecting the order of the categories,
      which a plain binary or linear model would ignore or misuse.
    likert_note: null
    caveats: []

  q_predict_predictor_count:
    type: question
    text: "How many predictor variables do you have?"
    why: "A single predictor is a simple regression; two or more is a multiple regression."
    hint: "A predictor is a variable used to predict the outcome, like hours studied or attendance rate."
    options:
      - value: one
        label: "One"
        description: "For example, predicting exam score from hours studied alone."
        next: rec_regression_linear_simple
      - value: two_plus
        label: "Two or more"
        description: "For example, predicting exam score from hours studied, attendance, and pretest score together."
        next: q_predict_entry_method

  rec_regression_linear_simple:
    type: recommendation
    primary_test: regression.linear
    nonparametric_alternative: null
    assumptions: [linearity, normality_of_residuals, homoscedasticity, independence_of_residuals, outliers]
    effect_size: [r_squared, f_squared]
    post_hoc: []
    why_this_test: >
      Simple linear regression predicts a continuous outcome from a single
      predictor, describing the relationship as a straight line.
    likert_note: null
    caveats: []

  q_predict_entry_method:
    type: question
    text: "Do you want to enter predictors in stages, to see how much each block adds?"
    why: >
      Hierarchical regression enters predictors in blocks (e.g. demographics
      first, then test scores) and reports the R-squared change at each
      step, which shows how much predictive value each block adds on top of
      the ones before it. If you just want the combined model, a standard
      multiple regression is simpler to report.
    hint: >
      Entering predictors in stages (blocks) lets you see how much
      predictive value each block adds on top of the ones before it.
    options:
      - value: "no"
        label: "No, enter them all at once"
        description: "For example, entering attendance, pretest score, and study hours together in a single step."
        next: rec_regression_linear_multiple
      - value: "yes"
        label: "Yes, in stages"
        description: "For example, entering demographics first, then adding pretest score, to see how much the pretest adds."
        next: rec_regression_hierarchical

  rec_regression_linear_multiple:
    type: recommendation
    primary_test: regression.linear
    nonparametric_alternative: null
    assumptions: [linearity, normality_of_residuals, homoscedasticity, independence_of_residuals, multicollinearity, outliers]
    effect_size: [r_squared, f_squared]
    post_hoc: []
    why_this_test: >
      Multiple regression predicts a continuous outcome from two or more
      predictors at once, showing each predictor's unique contribution
      while holding the others constant.
    likert_note: null
    caveats: []

  rec_regression_hierarchical:
    type: recommendation
    primary_test: regression.hierarchical
    nonparametric_alternative: null
    assumptions: [linearity, normality_of_residuals, homoscedasticity, independence_of_residuals, multicollinearity, outliers]
    effect_size: [r_squared, f_squared]
    post_hoc: []
    why_this_test: >
      Hierarchical regression enters predictors in blocks you choose and
      reports the R-squared change at each step, which shows how much
      predictive value each block adds beyond the ones entered before it.
    likert_note: null
    caveats: []

  # =======================================================================
  # RELIABILITY branch ("do my items hang together?")
  # =======================================================================
  q_reliability_type:
    type: question
    text: "What kind of items are you checking?"
    why: >
      Rating-scale items (like a Likert-scale survey) and right/wrong test
      items use different reliability coefficients.
    hint: >
      This is about whether your items are internally consistent - do
      they hang together as one scale?
    options:
      - value: rating_scale
        label: "Rating-scale items (e.g. a Likert-scale survey)"
        description: "For example, ten survey items rated 1-5 that are meant to measure classroom engagement."
        next: q_reliability_detail
      - value: right_wrong
        label: "Right/wrong test items"
        description: "For example, twenty exam questions each scored correct (1) or incorrect (0)."
        next: rec_kr20

  q_reliability_detail:
    type: question
    text: "What would you like to check?"
    why: >
      Cronbach's alpha is the standard starting point. McDonald's omega is a
      modern alternative that doesn't assume every item measures the
      construct equally well. Split-half reliability is a quick, simple
      check by splitting the scale in two. Item analysis looks at each item
      individually rather than the scale as a whole.
    hint: >
      These are different ways of asking how consistently a set of items
      measures the same thing.
    options:
      - value: overall_reliability
        label: "Overall internal consistency (the usual choice)"
        description: "The standard summary number (Cronbach's alpha) for how consistent a scale's items are."
        next: rec_cronbach_alpha
      - value: modern_alternative
        label: "A modern alternative that doesn't assume equal item quality"
        description: "For example, a scale where some items relate to the construct much more strongly than others."
        next: rec_mcdonald_omega
      - value: split_half
        label: "Split-half reliability"
        description: "Splits the items into two halves and checks whether the halves agree - a quick, simple check."
        next: rec_split_half
      - value: item_level_detail
        label: "How each individual item is performing"
        description: "For example, finding out which individual survey items are weak or not pulling their weight."
        next: rec_item_analysis

  rec_cronbach_alpha:
    type: recommendation
    primary_test: reliability.cronbach_alpha
    nonparametric_alternative: null
    assumptions: [tau_equivalence]
    effect_size: []
    post_hoc: []
    why_this_test: >
      Cronbach's alpha measures how consistently a set of items measures the
      same underlying idea, using the average correlation among all the
      items. Statly also reports alpha-if-item-deleted and corrected
      item-total correlations so you can spot a weak item.
    likert_note: null
    caveats: []

  rec_mcdonald_omega:
    type: recommendation
    primary_test: reliability.mcdonald_omega
    nonparametric_alternative: null
    assumptions: []
    effect_size: []
    post_hoc: []
    why_this_test: >
      McDonald's omega measures internal consistency without assuming every
      item contributes equally to the underlying construct (an assumption
      Cronbach's alpha makes but often doesn't hold), making it a more
      accurate estimate for many real scales.
    likert_note: null
    caveats: []

  rec_split_half:
    type: recommendation
    primary_test: reliability.split_half
    nonparametric_alternative: null
    assumptions: []
    effect_size: []
    post_hoc: []
    why_this_test: >
      Split-half reliability splits your items into two halves, correlates
      the two halves' scores, and adjusts the result with the Spearman-Brown
      formula. It's a quick reliability check that doesn't require any
      particular statistical model of the items.
    likert_note: null
    caveats: []

  rec_item_analysis:
    type: recommendation
    primary_test: reliability.item_analysis
    nonparametric_alternative: null
    assumptions: []
    effect_size: []
    post_hoc: []
    why_this_test: >
      Item analysis reports each item's difficulty and discrimination,
      showing which items are pulling their weight and which might be worth
      revising or dropping.
    likert_note: null
    caveats: []

  rec_kr20:
    type: recommendation
    primary_test: reliability.kr20
    nonparametric_alternative: null
    assumptions: [tau_equivalence]
    effect_size: []
    post_hoc: []
    why_this_test: >
      KR-20 is Cronbach's alpha specialized for right/wrong (0/1-scored)
      test items, and is the standard reliability estimate for a scored
      test.
    likert_note: null
    caveats: []

  # =======================================================================
  # VALIDITY branch ("do my questions measure what I think?")
  # =======================================================================
  q_validity_stage:
    type: question
    text: "Are you exploring the structure of your items for the first time, or confirming a structure you already expect?"
    why: >
      Exploratory factor analysis discovers how many underlying factors your
      items suggest, with no assumptions about the structure going in.
      Confirmatory factor analysis tests a specific, pre-specified structure
      (e.g. from theory or a prior EFA) and reports how well it fits.
    hint: >
      Exploratory means you don't yet know the structure; confirmatory
      means you're testing a specific structure you already expect.
    options:
      - value: exploring
        label: "Exploring for the first time"
        description: "For example, you have 20 survey items and want to discover how many underlying topics they group into."
        next: rec_efa
      - value: confirming
        label: "Confirming a structure I already expect"
        description: "For example, you expect four specific factors from theory and want to test whether the data fits that structure."
        next: rec_cfa

  rec_efa:
    type: recommendation
    primary_test: validity.efa
    nonparametric_alternative: null
    assumptions: [kmo_adequacy, bartlett_sphericity, sample_size]
    effect_size: []
    post_hoc: []
    why_this_test: >
      Exploratory factor analysis looks for patterns among your items to
      suggest how many underlying factors (ideas) they measure, without
      assuming a structure in advance. Statly reports KMO, Bartlett's test,
      a parallel analysis and scree plot to help choose the number of
      factors, and a rotated loadings table.
    likert_note: null
    caveats: [small_sample_efa]

  rec_cfa:
    type: recommendation
    primary_test: validity.cfa
    nonparametric_alternative: null
    assumptions: [sample_size, multivariate_normality]
    effect_size: []
    post_hoc: []
    why_this_test: >
      Confirmatory factor analysis tests whether a specific, pre-specified
      factor structure (e.g. from theory or an earlier EFA) fits your data,
      reporting fit indices (CFI, TLI, RMSEA, SRMR) and standardized
      loadings.
    likert_note: null
    caveats: [small_sample_cfa]
